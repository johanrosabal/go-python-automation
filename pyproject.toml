[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-automation-framework"
version = "3.0.0"
description = "Enterprise Dual Engine (Selenium & Playwright) Automation Framework with UI POM and REST API EOM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "QA Automation Engineering Team", email = "automation@enterprise.local" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --alluredir=reports/allure-results"
testpaths = [
    "applications/web",
    "applications/api"
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".pytest_cache",
    "__pycache__",
    "reports",
    "logs",
    "dist",
    "build",
    "tools/test_runner/templates"
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "F401",  # unused imports in __init__.py files
    "F841",  # local variable unused
    "B008",  # do not perform function calls in argument defaults
    "UP007", # Use `X | Y` for type annotations
]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
no_implicit_optional = false

